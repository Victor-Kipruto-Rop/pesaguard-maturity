plugins { id 'java'; id 'org.springframework.boot' version '3.4.5'; id 'io.spring.dependency-management' version '1.1.7' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies { implementation 'org.springframework.boot:spring-boot-starter'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; implementation 'org.springframework.boot:spring-boot-starter-jdbc'; runtimeOnly 'org.postgresql:postgresql'; testImplementation 'org.springframework.boot:spring-boot-starter-test' }
