spring:
  application:
    name: transaction-processing-service
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pesaguard}
    username: ${SPRING_DATASOURCE_USERNAME:pesaguard}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
