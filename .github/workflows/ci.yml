name: PesaGuard CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]

permissions:
  contents: read

jobs:
  core-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality and test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint new core domain and tests
        run: ruff check packages/core-domain/pesaguard_core tests/unit
      - name: Test deterministic reconciliation and repository gates
        run: python -m pytest -q tests/unit/test_reconciliation_matching.py tests/unit/test_repository_hygiene.py

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gateway dependencies
        run: python -m pip install --upgrade pip && pip install -r gateway/requirements.txt ruff pytest
      - name: Lint gateway
        run: ruff check gateway/app gateway/tests
      - name: Test gateway
        run: python -m pytest gateway/tests -q
      - name: Build gateway image
        run: docker build --tag pesaguard-gateway:${{ github.sha }} gateway
