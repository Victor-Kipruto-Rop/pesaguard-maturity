name: Source release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint core domain
        run: ruff check packages/core-domain/pesaguard_core tests/unit
      - name: Test core domain
        run: python -m pytest -q tests/unit/test_reconciliation_matching.py tests/unit/test_repository_hygiene.py

  publish-source-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub source release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
